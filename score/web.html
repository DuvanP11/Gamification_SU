<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Afinador · Score de Pilotos</title>
<style>
:root{--bg:#f6f6f8;--card:#fff;--text:#1a1a1f;--muted:#6b6b76;--border:#e3e3ea;--acc:#5b3df5;--ok:#16a34a;--bad:#dc2626;--warn:#b45309}
body{margin:0;font:13px/1.45 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{padding:12px 20px;background:#2d1f7a;color:#fff;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0}header select,header input,header button{font:inherit;padding:5px 8px;border-radius:6px;border:1px solid #fff5}
main{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px;max-width:1500px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
h2{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.w{display:grid;grid-template-columns:150px 1fr 38px;gap:8px;align-items:center;margin:3px 0;font-size:12px}
.w input[type=range]{width:100%}.w b{text-align:right;font-variant-numeric:tabular-nums}
.w.ev{color:#7a1f1f}.w.ev b{color:#7a1f1f}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;font-size:12px;white-space:nowrap}
th{color:var(--muted);font-weight:600;cursor:pointer}tbody tr{cursor:pointer}tbody tr:hover{background:#f0edff}tbody tr.sel{background:#e6e0ff}
.num{text-align:right;font-variant-numeric:tabular-nums}.pill{padding:2px 7px;border-radius:6px;font-weight:700;font-size:11px;color:#fff}
.b-EXCELENTE{background:#15803d}.b-BUENO{background:#65a30d}.b-ACEPTABLE{background:#ca8a04}.b-DEFICIENTE{background:#ea580c}.b-CRITICO{background:#dc2626}.b-EXTREMADAMENTE_CRITICO{background:#7f1d1d}.b-null{background:#9ca3af}
.est-BLOQUEADO,.est-RESTRINGIDO{color:var(--bad);font-weight:700}.est-SIN_SCORE{color:var(--muted)}
textarea{width:100%;height:320px;font:11px/1.35 ui-monospace,Menlo,monospace;border:1px solid var(--border);border-radius:6px;padding:8px;box-sizing:border-box}
button.p{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}button.s{background:#eee;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
#detalle table td:nth-child(3),#detalle table td:nth-child(4),#detalle table td:nth-child(5){text-align:right}
.aviso{color:var(--warn);font-size:12px;margin-top:6px}.err{color:var(--bad)}
.bloques{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;font-size:12px}.bloques div{background:#f3f0ff;border-radius:8px;padding:6px 10px}
small{color:var(--muted)}
.idc{font-family:ui-monospace,Menlo,monospace;font-size:11px;cursor:copy;user-select:all;white-space:nowrap}.idc:hover{color:var(--acc)}.idc b{color:var(--acc);font-size:12px}
.resumen{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin:6px 0 14px}
.paso{background:#f3f0ff;border-radius:10px;padding:10px 14px;min-width:150px;flex:1}
.paso .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.paso .v{font-size:22px;font-weight:800;margin-top:2px}.paso .t{font-size:11px;color:var(--muted);margin-top:2px}
.paso.final{background:#2d1f7a;color:#fff}.paso.final .k,.paso.final .t{color:#d8d2ff}
.flecha{align-self:center;font-size:20px;color:var(--muted)}
.sec{margin-top:14px}.sec h3{font-size:13px;margin:0 0 2px}.sec p.intro{margin:0 0 8px;color:var(--muted);font-size:12px}
.fila{display:grid;grid-template-columns:170px 1fr 190px 150px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.fila .nom{font-weight:600}.fila .nom small{display:block;font-weight:400}
.fila .que{font-size:12px;white-space:normal}.fila .que b{font-weight:600}
.barra{height:10px;background:#ececf2;border-radius:6px;overflow:hidden}.barra i{display:block;height:100%;border-radius:6px}
.pts{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap}
.ef{font-size:12px;white-space:normal}.ef b{font-size:14px}.ef.neg b{color:var(--bad)}.ef.pos b{color:var(--ok)}.ef.cero{color:var(--muted)}
.nota{font-size:11px;color:var(--muted);margin-top:8px}
.alerta{background:#fff4e5;border:1px solid #f5c98a;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:12px}
@media(max-width:900px){.fila{grid-template-columns:1fr}}
@media(max-width:900px){main{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Afinador · Score de Pilotos</h1>
 <label>Tipo <select id="tipo"><option>B2B</option><option>RENT</option><option>B2C</option><option value="">Todos</option></select></label>
 <label>Datos <select id="fuente"></select></label>
 <label>Fecha de corte <input id="hoy" type="date"></label>
 <label><input type="checkbox" id="soloDef" checked> sólo definitivos (≥ n_min servicios)</label>
 <button class="p" id="guardarPesos">Guardar pesos.yaml</button>
 <button class="s" id="guardarParams">Guardar parametros.yaml</button>
 <span id="msg" style="font-size:12px"></span></header>
<main>
 <div>
  <div class="card"><h2>Pesos <small id="tipoPesos"></small></h2><div id="pesos"></div>
   <div class="w" style="margin-top:8px"><span>α antecedentes</span><input type="range" id="alpha" min="0" max="1" step="0.05"><b id="alphaV"></b></div>
   <div id="avisos" class="aviso"></div></div>
  <div class="card" style="margin-top:12px"><h2>Parámetros (YAML, se aplica al recalcular)</h2><textarea id="params"></textarea>
   <div style="margin-top:6px"><button class="p" id="recalc">Recalcular</button> <small>los sliders recalculan solos</small></div></div>
 </div>
 <div>
  <div class="card"><h2>Ranking <small id="rankInfo"></small></h2><div id="ranking"></div></div>
  <div class="card" style="margin-top:12px" id="detalle"><h2>Desglose</h2><small>Clic en un piloto.</small></div>
 </div>
</main>
<script>
var CFG=null, PESOS=null, RANK=null, NFILAS=0, SEL=null, VARS=[], DET={};
var EVENTOS=['suspension_piloto','suspension_pasajero','invitacion_pibox','invitacion_rent','expulsion','baneo_imei'];
function $(id){return document.getElementById(id)}
async function init(){
  CFG=await (await fetch('/api/config')).json(); PESOS=CFG.pesos; $('params').value=CFG.parametros_yaml; $('hoy').value=CFG.hoy;
  $('fuente').innerHTML=CFG.fuentes.map(function(f){return '<option value="'+f+'">'+(f==='data'?'ficticios (data)':f==='data_real'?'REALES (data_real)':f)+'</option>'}).join('');
  var pref=CFG.fuentes.indexOf('data_real')>=0?'data_real':'data'; try{pref=localStorage.getItem('fuente')||pref}catch(e){} if(CFG.fuentes.indexOf(pref)>=0)$('fuente').value=pref;
  var a=CFG.parametros.general.alpha_antecedentes; if(a===undefined)a=1; $('alpha').value=a; $('alphaV').textContent=a;
  renderPesos(); recalc();
}
function tipoSel(){return $('tipo').value||'B2B'}
function renderPesos(){
  var t=tipoSel(), apl=CFG.parametros.aplicabilidad, cont=$('pesos'); cont.innerHTML=''; $('tipoPesos').textContent='('+t+')';
  VARS=Object.keys(apl).filter(function(v){return apl[v].indexOf(t)>=0});
  VARS.forEach(function(v){ if(PESOS[t][v]===undefined)PESOS[t][v]=0;
    var d=document.createElement('div'); d.className='w'+(EVENTOS.indexOf(v)>=0?' ev':'');
    d.innerHTML='<span title="'+(EVENTOS.indexOf(v)>=0?'antecedente (descuenta)':'desempeño (suma)')+'">'+v+'</span><input type="range" min="0" max="40" step="1" value="'+PESOS[t][v]+'"><b>'+PESOS[t][v]+'</b>';
    var r=d.querySelector('input'), b=d.querySelector('b');
    r.oninput=function(){PESOS[t][v]=+r.value;b.textContent=r.value;recalcDebounced()}; cont.appendChild(d); });
}
var tm=null; function recalcDebounced(){clearTimeout(tm);tm=setTimeout(recalc,NFILAS>5000?600:150)}
function paramsConAlpha(){ // inyecta alpha del slider en el YAML sin reformatearlo
  var y=$('params').value, a=$('alpha').value;
  if(/^\s*alpha_antecedentes:.*$/m.test(y)) return y.replace(/^(\s*alpha_antecedentes:).*$/m,'$1 '+a);
  return y.replace(/^general:\s*$/m,'general:\n  alpha_antecedentes: '+a);
}
async function recalc(){
  var body={pesos:PESOS,parametros_yaml:paramsConAlpha(),hoy:$('hoy').value,datos:$('fuente').value,solo_definitivos:$('soloDef').checked,n:10};
  $('msg').textContent='calculando…';
  var d=await (await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
  if(!d.ok){$('msg').innerHTML='<span class="err">'+d.error+'</span>';return} $('msg').textContent='';
  RANK=d.ranking; PARAMS=d.parametros; NFILAS=d.n_filas; var av=d.avisos[tipoSel()]||[]; $('avisos').textContent=av.length?'⚠ '+av.join(' · '):'';
  renderTabla(); if(SEL) renderDetalle(SEL);
}
function fmt(x){return x==null?'—':Number(x).toFixed(1)}
function fecha(d){return d?d.slice(0,10):'—'}
function calif(x){return x==null?'—':Number(x).toFixed(1)}
function idCell(id,rotulo){if(!id)return '<small>'+rotulo+': —</small>';
  return '<span class="idc" data-id="'+id+'" title="Clic para copiar el ID de '+rotulo+'"><small>'+rotulo+'</small> '+id+' <b>⧉</b></span>'}
function copiarId(el){var id=el.dataset.id, ok=function(){var b=el.querySelector('b'); b.textContent='✓'; setTimeout(function(){b.textContent='⧉'},1200)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(id).then(ok,function(){copiarFallback(id);ok()})}else{copiarFallback(id);ok()}}
function copiarFallback(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta)}
function filaRank(r,pos){var obs=(r.observaciones||[]).slice(); if(r.caso) obs.push('<i>caso de prueba: '+r.caso+'</i>');
  return '<tr data-k="'+r.piloto_id+'|'+r.tipo+'" class="'+(SEL===r.piloto_id+'|'+r.tipo?'sel':'')+'"><td class="num">'+pos+'</td><td><b>'+r.nombre+'</b><br><small>'+r.piloto_id+' · '+r.tipo+'</small></td>'+
   '<td>'+idCell(r.driver_id||r.piloto_id,'piloto')+(r.passenger_id&&r.passenger_id!==r.driver_id?'<br>'+idCell(r.passenger_id,'pasajero'):'')+'</td><td>'+fecha(r.activado_piloto)+'<br>'+fecha(r.activado_pasajero)+'</td><td class="num">'+(r.gamif_final!=null?'nivel '+Math.round(r.gamif_final)+' <small title="total_score_points · new_final_score">('+Math.round(r.gamif_puntos||0).toLocaleString('es-CO')+' pts · '+calif(r.calif_gamification)+')</small>':calif(r.calif_gamification))+'<br>'+calif(r.calif_app)+'</td>'+
   '<td class="num"><b style="font-size:15px">'+fmt(r.score_final)+'</b>'+(r.score_final!==r.score_comportamental?'<br><small>score '+fmt(r.score_comportamental)+'</small>':'')+'</td><td><span class="pill b-'+r.banda+'">'+(r.banda||'SIN SCORE')+'</span><br><small>'+r.vigencia.toLowerCase()+' · n='+r.n_aplicables+'</small></td>'+
   '<td class="est-'+r.estado+'">'+r.estado+'</td><td style="white-space:normal;min-width:260px;font-size:11px">'+(obs.length?obs.join('<br>'):'<small>Sin observaciones</small>')+'</td></tr>'}
function bloqueRank(titulo,rows,offset,color){ if(!rows.length) return '';
  return '<h3 style="margin:14px 0 4px;font-size:13px;color:'+color+'">'+titulo+' <small>('+rows.length+')</small></h3><table><thead><tr><th>#</th><th>Piloto</th><th>ID</th><th>Activación piloto<br>Activación pasajero</th><th class="num">Gamification (nivel)<br>App</th><th class="num">Score</th><th>Banda</th><th>Estado</th><th>Observaciones</th></tr></thead><tbody>'+rows.map(function(r,i){return filaRank(r,offset+i+1)}).join('')+'</tbody></table>'}
function renderTabla(){
  if(!RANK) return; var t=$('tipo').value, tipos=t?[t]:['B2B','RENT','B2C'], h='', info=[];
  tipos.forEach(function(tp){var k=RANK[tp]; if(!k) return;
    info.push(tp+': '+k.n_ranking+' en ranking de '+k.n_total+(k.n_provisional?' ('+k.n_provisional+' provisionales'+($('soloDef').checked?' excluidos':'')+(k.n_sin_score?', '+k.n_sin_score+' sin score':'')+')':''));
    var bandas=Object.keys(k.bandas).map(function(b){return '<span class="pill b-'+b+'" style="margin-right:4px">'+b+' '+k.bandas[b]+'</span>'}).join('');
    if(tipos.length>1) h+='<h2 style="margin-top:18px">'+tp+'</h2>';
    h+='<div style="margin:4px 0 6px">'+bandas+'</div>';
    h+=bloqueRank('Top 10 mejores',k.top,0,'#15803d')+bloqueRank('10 del medio',k.medio,k.medio_desde,'#ca8a04')+bloqueRank('10 peores',k.peores,k.peores_desde,'#dc2626');
    if(!k.n_ranking) h+='<div class="nota">Sin pilotos para rankear en '+tp+' con los filtros actuales.</div>';
  });
  $('rankInfo').textContent='· '+NFILAS.toLocaleString('es-CO')+' filas · '+info.join(' · ')+' · clic en una fila para ver el desglose';
  $('ranking').innerHTML=h;
  Array.prototype.forEach.call($('ranking').querySelectorAll('tr[data-k]'),function(tr){tr.onclick=function(ev){if(ev.target.closest&&ev.target.closest('.idc'))return;SEL=tr.dataset.k;marcarSel();renderDetalle(SEL)}});
  Array.prototype.forEach.call($('ranking').querySelectorAll('.idc'),function(el){el.onclick=function(ev){ev.stopPropagation();copiarId(el)}});
  marcarSel();
}
function marcarSel(){Array.prototype.forEach.call($('ranking').querySelectorAll('tr[data-k]'),function(tr){tr.className=tr.dataset.k===SEL?'sel':''})}
var NOMBRES={suspension_piloto:['Suspensiones como piloto','antecedente'],suspension_pasajero:['Suspensiones como pasajero','antecedente'],invitacion_pibox:['Invitaciones Pibox','antecedente'],invitacion_rent:['Invitaciones Rent','antecedente'],expulsion:['Expulsiones','antecedente'],baneo_imei:['Baneo de IMEI','antecedente'],cancelacion_piloto:['Cancelaciones propias','desempeño'],finalizados:['Experiencia (servicios finalizados)','desempeño'],sin_novedades:['Servicios sin novedad y a tiempo','desempeño'],alto_valor:['Responsabilidad en alto valor','desempeño'],cumplimiento_reservas:['Cumplimiento de reservas','desempeño'],recaudo_24h:['Recaudo pagado en 24 h hábiles','desempeño']};
var PARAMS=null;
function pct(x,d){return (x*100).toFixed(d==null?0:d).replace('.',',')+' %'}
function dias(n){if(n>=365){var a=n/365;return a%1<0.1?Math.round(a)+(Math.round(a)===1?' año':' años'):a.toFixed(1).replace('.',',')+' años'}return n>=60?Math.round(n/30)+' meses':n+' días'}
function plural(n,s,p){return n+' '+(n===1?s:p)}
// Qué pasó (en palabras) + cómo se convierte en puntos, por variable
function explicar(v,s,r){
  var d=s.detalle, t=r.tipo, P=PARAMS||CFG.parametros;
  if(EVENTOS.indexOf(v)>=0){
    var c=P.eventos[v], nombre=NOMBRES[v][0].toLowerCase();
    if(!d.n_eventos) return {que:'Sin '+nombre+' registradas en los últimos '+dias(P.general.ventana_eventos_dias)+'.',como:'Sin eventos = 5 de 5. No descuenta nada.'};
    var fuera=d.n_eventos-d.en_ventana, lista=(d.edades_dias||[]).slice().sort(function(a,b){return a-b}).map(function(e){return 'hace '+dias(e)}).join(', ');
    var que=(d.en_ventana?plural(d.en_ventana,'evento','eventos')+' ('+lista+')':'Ninguno reciente')+(fuera?'; '+plural(fuera,'evento','eventos')+' de hace más de '+dias(P.general.ventana_eventos_dias)+' ya no cuenta':'')+'.';
    if(!d.en_ventana) return {que:que,como:'Sin eventos recientes = 5 de 5. No descuenta nada.'};
    var como='Cada evento pesa 1 el día que ocurre y la mitad cada '+dias(c.semivida_dias)+'; hoy suman <b>'+d.carga+'</b> de un tope de '+d.tope+' (con '+d.tope+' o más la variable llega a 0).';
    return {que:que,como:como};
  }
  if(v==='cancelacion_piloto'){var c=P.tasas[v];
    return {que:'Canceló <b>'+d.x+' de '+d.n+'</b> servicios que dependían de él ('+pct(d.tasa_cruda,1)+'). '+(d.excluidos_no_atribuibles?'No se le cuentan '+d.excluidos_no_atribuibles+' cancelados por el pasajero o la plataforma.':''),
            como:'Ajustado por volumen queda en '+pct(d.tasa_ajustada,1)+'. '+pct(c.x_score5)+' o menos = 5 puntos; '+pct(c.x_score0)+' o más = 0.'};}
  if(v==='finalizados'){
    return {que:'<b>'+d.n+'</b> servicios finalizados en la ventana'+(d.tasa_finalizacion!=null?' (terminó el '+pct(d.tasa_finalizacion)+' de los que dependían de él)':'')+'.',
            como:'La experiencia suma rápido al principio y se llena a los '+d.n_ref+' servicios; de ahí en adelante no da más puntos.'};}
  if(v==='sin_novedades'){var c=P.tasas[v];
    return {que:'<b>'+d.x+' de '+d.n+'</b> servicios finalizados salieron sin novedad y a tiempo ('+pct(d.tasa_cruda,1)+').',
            como:'Ajustado por volumen: '+pct(d.tasa_ajustada,1)+'. '+pct(c.x_score5)+' o más = 5 puntos; '+pct(c.x_score0)+' o menos = 0.'};}
  if(v==='alto_valor'){var c=P.tasas[v], ex=d.exposicion, nivel=ex>=0.8?'alta':ex>=0.4?'media':'baja';
    return {que:'<b>'+d.n_alto_valor+'</b> servicios de alto valor ('+pct(d.proporcion)+' de sus servicios), <b>'+d.ok+'</b> sin novedad.',
            como:'Exposición '+nivel+' ('+ex.toFixed(2)+' de 1: se necesitan '+c.n_ref+' servicios y que sean el '+pct(c.prop_ref)+' del total). Cumplimiento ajustado '+pct(d.cumplimiento_ajustado,1)+' → '+d.score_desempeno.toFixed(2)+' pts; con poca exposición el resultado se queda cerca del neutro ('+d.score_neutro.toFixed(2)+').'};}
  if(v==='recaudo_24h'){var c=P.tasas[v];
    var extra=[]; if(d.vencidos_sin_pagar) extra.push('<b>'+d.vencidos_sin_pagar+' vencido'+(d.vencidos_sin_pagar>1?'s':'')+' sin pagar</b>'); if(d.pendientes_en_plazo) extra.push(d.pendientes_en_plazo+' pendiente'+(d.pendientes_en_plazo>1?'s':'')+' todavía en plazo (no cuenta)');
    return {que:'Tuvo <b>'+d.episodios+'</b> recaudo'+(d.episodios>1?'s':'')+' sin abonar en el momento; pagó <b>'+d.a_tiempo+' de '+d.n+'</b> dentro de '+d.limite_horas+' h hábiles'+(d.tarde?', '+d.tarde+' tarde':'')+(extra.length?'; '+extra.join(', '):'')+'.',
            como:'Las horas corren de lunes a viernes (sábado y domingo no cuentan). Ajustado por volumen: '+pct(d.tasa_ajustada,1)+'. '+pct(c.x_score5)+' o más a tiempo = 5 puntos; '+pct(c.x_score0)+' o menos = 0.'};}
  if(v==='cumplimiento_reservas'){var c=P.tasas[v];
    return {que:'Cumplió <b>'+d.cumplidas+' de '+d.n+'</b> reservas que dependían de él ('+pct(d.tasa_cruda,1)+'). '+(d.no_atribuibles_excluidas?d.no_atribuibles_excluidas+' con causa ajena no se cuentan.':''),
            como:'Ajustado por volumen: '+pct(d.tasa_ajustada,1)+'. '+pct(c.x_score5)+' o más = 5 puntos; '+pct(c.x_score0)+' o menos = 0.'};}
  return {que:'',como:''};
}
function colorSub(x){return x>=4?'#16a34a':x>=3?'#65a30d':x>=2?'#ca8a04':x>=1?'#ea580c':'#dc2626'}
function filaHTML(v,s,c,r){
  var e=explicar(v,s,r), sub=s.score, esAnt=EVENTOS.indexOf(v)>=0, ef;
  if(!c) ef='<div class="ef cero">Peso 0: no influye</div>';
  else if(esAnt) ef=c.descuento>0.0005?'<div class="ef neg"><b>−'+pct(c.descuento,1)+'</b> del score<br><small>pesa '+pct(c.peso_efectivo)+' de los antecedentes: podría descontar hasta '+pct(c.peso_efectivo)+'</small></div>':'<div class="ef cero">No descuenta<br><small>pesa '+pct(c.peso_efectivo)+' de los antecedentes</small></div>';
  else ef='<div class="ef pos"><b>+'+c.aporte.toFixed(2)+'</b> al desempeño<br><small>pesa '+pct(c.peso_efectivo)+' del desempeño (máx. +'+(c.peso_efectivo*5).toFixed(2)+')</small></div>';
  return '<div class="fila"><div class="nom">'+NOMBRES[v][0]+'<small>'+v+'</small></div><div class="que">'+e.que+'<br><small>'+e.como+'</small></div>'+
    '<div><div class="barra"><i style="width:'+(sub/5*100)+'%;background:'+colorSub(sub)+'"></i></div><div class="pts"><b>'+sub.toFixed(2)+'</b> de 5 puntos</div></div>'+ef+'</div>';
}
async function renderDetalle(k){
  var partes=k.split('|'), body={pesos:PESOS,parametros_yaml:paramsConAlpha(),hoy:$('hoy').value,datos:$('fuente').value,piloto_id:partes[0],tipo:partes[1]};
  var d=await (await fetch('/api/detalle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
  if(!d.ok){$('detalle').innerHTML='<h2>Desglose</h2><div class="alerta">'+d.error+'</div>';return}
  var r=d.detalle; PARAMS=d.parametros; var b=r.contribuciones._bloques;
  var h='<h2>Desglose · '+r.piloto_id+' '+r.nombre+' · '+r.tipo+'</h2>';
  if(!b){$('detalle').innerHTML=h+'<div class="alerta">Sin score: no tiene servicios en la ventana sobre los que evaluar el desempeño.</div>';return}
  var sc=b.D_desempeno*b.factor;
  h+='<div class="resumen"><div class="paso"><div class="k">1 · Desempeño</div><div class="v">'+b.D_desempeno.toFixed(2)+' <small>/ 5</small></div><div class="t">promedio ponderado de cómo le fue en la operación</div></div><div class="flecha">→</div>'+
     '<div class="paso"><div class="k">2 · Antecedentes</div><div class="v">−'+pct(b.P_antecedentes*b.alpha,1)+'</div><div class="t">'+(b.P_antecedentes>0?'descuento por su historial disciplinario':'historial limpio: no descuenta')+'</div></div><div class="flecha">→</div>'+
     '<div class="paso"><div class="k">3 · Score</div><div class="v">'+sc.toFixed(2)+'</div><div class="t">'+b.D_desempeno.toFixed(2)+' × (1 − '+pct(b.P_antecedentes*b.alpha,1)+')</div></div>'+
     (r.tope_por_regla!=null?'<div class="flecha">→</div><div class="paso"><div class="k">4 · Regla</div><div class="v">tope '+r.tope_por_regla.toFixed(1)+'</div><div class="t">'+r.alertas.join(', ')+'</div></div>':'')+
     '<div class="flecha">=</div><div class="paso final"><div class="k">Score final</div><div class="v">'+fmt(r.score_final)+' <small>'+(r.banda||'')+'</small></div><div class="t">'+(r.vigencia==='DEFINITIVO'?'definitivo: '+r.n_aplicables+' servicios (mín. '+r.n_min+')':'PROVISIONAL: sólo '+r.n_aplicables+' servicios de los '+r.n_min+' necesarios')+'</div></div></div>';
  if(r.estado==='BLOQUEADO') h+='<div class="alerta">⛔ <b>Bloqueado por regla de riesgo</b> ('+r.alertas.join(', ')+'). El score se calcula igual pero no habilita nada.</div>';
  else if(r.estado==='RESTRINGIDO') h+='<div class="alerta">⚠ <b>Restringido</b>: '+r.restricciones_activas.concat((r.documentos||{}).restringe||[]).join(' · ')+'. El score se muestra, pero la restricción manda.</div>';
  if(r.alertas.length&&r.estado!=='BLOQUEADO'&&r.tope_por_regla==null) h+='<div class="alerta">ℹ Reglas activas sólo como alerta (la conducta ya la mide el score): '+r.alertas.join(', ')+'</div>';
  var dc=r.documentos||{}, dd=dc.detalle||{};
  if(dd.licencia!==undefined){
    var items=[['Licencia (RUNT)',dd.licencia+(dd.runt_consultado?' · consultado '+dd.runt_consultado:'')],['Policía',dd.policia],['SOAT',dd.soat_vence?'vence '+dd.soat_vence:'sin dato'],['Tecnomecánica',dd.tecno_vence?'vence '+dd.tecno_vence:'sin dato']];
    h+='<div class="sec"><h3>Documentos y habilitación</h3><p class="intro">No dan ni quitan puntos: una condición vencida restringe o alerta según parametros.yaml → documentos.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px">'+
       items.map(function(it){return '<div style="background:#f6f6f8;border-radius:8px;padding:8px 10px"><div style="font-size:11px;color:var(--muted)">'+it[0]+'</div><div>'+it[1]+'</div></div>'}).join('')+'</div>'+
       (dc.restringe&&dc.restringe.length?'<div class="alerta" style="margin-top:8px">⛔ '+dc.restringe.join('<br>')+'</div>':'')+
       (dc.alertas&&dc.alertas.length?'<div class="alerta" style="margin-top:8px;background:#fffbe6;border-color:#f0dc8a">⚠ '+dc.alertas.join('<br>')+'</div>':'')+
       (dc.por_vencer&&dc.por_vencer.length?'<div class="nota" style="margin-top:6px">⏳ '+dc.por_vencer.join(' · ')+'</div>':'')+'</div>';
  }
  var noap=[], sind=[];
  h+='<div class="sec"><h3>Cómo le fue en la operación (desempeño)</h3><p class="intro">Cada variable da de 0 a 5 puntos; el desempeño es el promedio, donde cada una pesa según su importancia.</p>';
  Object.keys(r.sub_scores).forEach(function(v){var s=r.sub_scores[v];if(EVENTOS.indexOf(v)>=0)return;if(s.score==null){(s.motivo==='no_aplica'?noap:sind).push(NOMBRES[v][0]);return}h+=filaHTML(v,s,r.contribuciones[v],r)});
  h+='</div><div class="sec"><h3>Su historial (antecedentes)</h3><p class="intro">Un historial limpio no suma puntos: sólo descuenta cuando hay eventos, y cada evento pierde peso con el tiempo.</p>';
  Object.keys(r.sub_scores).forEach(function(v){var s=r.sub_scores[v];if(EVENTOS.indexOf(v)<0)return;if(s.score==null){(s.motivo==='no_aplica'?noap:sind).push(NOMBRES[v][0]);return}h+=filaHTML(v,s,r.contribuciones[v],r)});
  h+='</div>';
  if(noap.length) h+='<div class="nota">No aplican en '+r.tipo+' (fuera del cálculo, no cuentan como 0): '+noap.join(', ')+'.</div>';
  if(sind.length) h+='<div class="nota">Sin dato para evaluar (fuera del cálculo): '+sind.join(', ')+'.</div>';
  $('detalle').innerHTML=h;
}
$('tipo').onchange=function(){renderPesos();renderTabla()}; $('hoy').onchange=recalc; $('soloDef').onchange=recalc; $('fuente').onchange=function(){try{localStorage.setItem('fuente',$('fuente').value)}catch(e){} SEL=null; $('detalle').innerHTML='<h2>Desglose</h2><small>Clic en un piloto.</small>'; recalc()}; $('recalc').onclick=recalc;
$('alpha').oninput=function(){$('alphaV').textContent=$('alpha').value;recalcDebounced()};
$('guardarPesos').onclick=async function(){var d=await (await fetch('/api/guardar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pesos:PESOS})})).json();$('msg').textContent=d.ok?'✓ pesos.yaml guardado':d.error};
$('guardarParams').onclick=async function(){var d=await (await fetch('/api/guardar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({parametros_yaml:paramsConAlpha()})})).json();$('msg').textContent=d.ok?'✓ parametros.yaml guardado':d.error;if(d.ok)$('params').value=paramsConAlpha()};
init();
</script></body></html>
