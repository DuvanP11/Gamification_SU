<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Afinador · Score de Pilotos</title>
<style>
:root{--bg:#f6f6f8;--card:#fff;--text:#1a1a1f;--muted:#6b6b76;--border:#e3e3ea;--acc:#5b3df5;--ok:#16a34a;--bad:#dc2626;--warn:#b45309}
body{margin:0;font:13px/1.45 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{padding:12px 20px;background:#2d1f7a;color:#fff;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0}header select,header input,header button{font:inherit;padding:5px 8px;border-radius:6px;border:1px solid #fff5}
main{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px;max-width:1500px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
h2{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.w{display:grid;grid-template-columns:150px 1fr 38px;gap:8px;align-items:center;margin:3px 0;font-size:12px}
.w input[type=range]{width:100%}.w b{text-align:right;font-variant-numeric:tabular-nums}
.w{grid-template-columns:150px 1fr 30px 38px}.w.ev{color:#7a1f1f}.w.ev b{color:#7a1f1f}.w .pe{text-align:right;color:var(--muted);font-size:10px}
.grp{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:10px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--border)}.grp.ev{color:#7a1f1f}.grp b{text-transform:none;letter-spacing:0}
#insight{font-size:12px;line-height:1.5;color:var(--text);background:#f3f0ff;border-radius:8px;padding:8px 10px;margin-top:10px}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;font-size:12px;white-space:nowrap}
th{color:var(--muted);font-weight:600;cursor:pointer}tbody tr{cursor:pointer}tbody tr:hover{background:#f0edff}tbody tr.sel{background:#e6e0ff}
.num{text-align:right;font-variant-numeric:tabular-nums}.pill{padding:2px 7px;border-radius:6px;font-weight:700;font-size:11px;color:#fff}
.b-EXCELENTE{background:#15803d}.b-BUENO{background:#65a30d}.b-ACEPTABLE{background:#ca8a04}.b-DEFICIENTE{background:#ea580c}.b-CRITICO{background:#dc2626}.b-EXTREMADAMENTE_CRITICO{background:#7f1d1d}.b-null{background:#9ca3af}
.est-BLOQUEADO,.est-RESTRINGIDO{color:var(--bad);font-weight:700}.est-SIN_SCORE{color:var(--muted)}
textarea{width:100%;height:320px;font:11px/1.35 ui-monospace,Menlo,monospace;border:1px solid var(--border);border-radius:6px;padding:8px;box-sizing:border-box}
button.p{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}button.s{background:#eee;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
#detalle table td:nth-child(3),#detalle table td:nth-child(4),#detalle table td:nth-child(5){text-align:right}
.aviso{color:var(--warn);font-size:12px;margin-top:6px}.err{color:var(--bad)}
.bloques{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;font-size:12px}.bloques div{background:#f3f0ff;border-radius:8px;padding:6px 10px}
small{color:var(--muted)}
.idc{font-family:ui-monospace,Menlo,monospace;font-size:11px;cursor:copy;user-select:all;white-space:nowrap}.idc:hover{color:var(--acc)}.idc b{color:var(--acc);font-size:12px}
.resumen{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin:6px 0 14px}
.paso{background:#f3f0ff;border-radius:10px;padding:10px 14px;min-width:150px;flex:1}
.paso .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.paso .v{font-size:22px;font-weight:800;margin-top:2px}.paso .t{font-size:11px;color:var(--muted);margin-top:2px}
.paso.final{background:#2d1f7a;color:#fff}.paso.final .k,.paso.final .t{color:#d8d2ff}
.flecha{align-self:center;font-size:20px;color:var(--muted)}
.sec{margin-top:14px}.sec h3{font-size:13px;margin:0 0 2px}.sec p.intro{margin:0 0 8px;color:var(--muted);font-size:12px}
.fila{display:grid;grid-template-columns:170px 1fr 190px 150px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.fila .nom{font-weight:600}.fila .nom small{display:block;font-weight:400}
.fila .que{font-size:12px;white-space:normal}.fila .que b{font-weight:600}
.barra{height:10px;background:#ececf2;border-radius:6px;overflow:hidden}.barra i{display:block;height:100%;border-radius:6px}
.pts{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap}
.ef{font-size:12px;white-space:normal}.ef b{font-size:14px}.ef.neg b{color:var(--bad)}.ef.pos b{color:var(--ok)}.ef.cero{color:var(--muted)}
.nota{font-size:11px;color:var(--muted);margin-top:8px}
.alerta{background:#fff4e5;border:1px solid #f5c98a;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:12px}
@media(max-width:900px){.fila{grid-template-columns:1fr}}
@media(max-width:900px){main{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Afinador · Score de Pilotos</h1>
 <label>Tipo <select id="tipo"><option>B2B</option><option>RENT</option><option>B2C</option><option value="">Todos</option></select></label>
 <label>Datos <select id="fuente"></select></label>
 <label>Fecha de corte <input id="hoy" type="date"></label>
 <label><input type="checkbox" id="soloDef" checked> sólo definitivos (≥ n_min servicios)</label>
 <button class="p" id="guardarPesos">Guardar pesos.yaml</button>
 <button class="s" id="guardarParams">Guardar parametros.yaml</button>
 <span id="msg" style="font-size:12px"></span></header>
<main>
 <div>
  <div class="card"><h2>Pesos <small id="tipoPesos"></small></h2><div id="pesos"></div>
   <div class="w" style="margin-top:8px"><span>α antecedentes</span><input type="range" id="alpha" min="0" max="1" step="0.05"><b id="alphaV"></b></div>
   <div id="avisos" class="aviso"></div><div id="insight"></div></div>
  <div class="card" style="margin-top:12px"><h2>Parámetros (YAML, se aplica al recalcular)</h2><textarea id="params"></textarea>
   <div style="margin-top:6px"><button class="p" id="recalc">Recalcular</button> <small>los sliders recalculan solos</small></div></div>
 </div>
 <div>
  <div class="card"><h2>Ranking <small id="rankInfo"></small></h2><div id="ranking"></div></div>
  <div class="card" style="margin-top:12px" id="detalle"><h2>Desglose</h2><small>Clic en un piloto.</small></div>
 </div>
</main>
<script>
var CFG=null, PESOS=null, RANK=null, NFILAS=0, SEL=null, VARS=[], DET={};
var EVENTOS=['suspension_piloto','suspension_pasajero','invitacion_pibox','invitacion_rent','expulsion','baneo_imei','conducta_inapropiada'];
var BASE=['finalizados','antiguedad'];
var MIXTAS=['sin_novedades','recaudo_24h','recaudo_entregado','alto_valor','cumplimiento_reservas','calificacion_pasajero'];
function bloqueDe(v){return BASE.indexOf(v)>=0?'base':MIXTAS.indexOf(v)>=0?'mixta':'negativa'}
function esPenal(v){return BASE.indexOf(v)<0}
function $(id){return document.getElementById(id)}
async function init(){
  CFG=await (await fetch('/api/config')).json(); PESOS=CFG.pesos; $('params').value=CFG.parametros_yaml; $('hoy').value=CFG.hoy;
  $('fuente').innerHTML=CFG.fuentes.map(function(f){return '<option value="'+f+'">'+(f==='data'?'ficticios (data)':f==='data_real'?'REALES (data_real)':f)+'</option>'}).join('');
  var pref=CFG.fuentes.indexOf('data_real')>=0?'data_real':'data'; try{pref=localStorage.getItem('fuente')||pref}catch(e){} if(CFG.fuentes.indexOf(pref)>=0)$('fuente').value=pref;
  var a=CFG.parametros.general.alpha_antecedentes; if(a===undefined)a=1; $('alpha').value=a; $('alphaV').textContent=a;
  renderPesos(); recalc();
}
function tipoSel(){return $('tipo').value||'B2B'}
function renderPesos(){
  var t=tipoSel(), apl=CFG.parametros.aplicabilidad, cont=$('pesos'); cont.innerHTML=''; $('tipoPesos').textContent='('+t+')';
  VARS=Object.keys(apl).filter(function(v){return apl[v].indexOf(t)>=0});
  var grupos=[['desempeño','Base ganada · sólo suma (0 → '+(CFG.parametros.general.base_confianza_max||3.5)+')',VARS.filter(function(v){return bloqueDe(v)==='base'})],
              ['mixtas','Mixtas · suman si está mejor que la referencia, restan si peor',VARS.filter(function(v){return bloqueDe(v)==='mixta'})],
              ['antecedentes','Negativas · sólo restan',VARS.filter(function(v){return bloqueDe(v)==='negativa'})]];
  grupos.forEach(function(g){
    var h=document.createElement('div'); h.className='grp'+(g[0]==='antecedentes'?' ev':''); h.innerHTML='<span>'+g[1]+'</span><b id="tot-'+g[0]+'"></b>'; cont.appendChild(h);
    if(!g[2].length){h.style.display='none'}
    g[2].forEach(function(v){ if(PESOS[t][v]===undefined)PESOS[t][v]=0;
      var d=document.createElement('div'); d.className='w'+(g[0]==='antecedentes'?' ev':'');
      d.innerHTML='<span title="'+v+'">'+((NOMBRES[v]||[v])[0])+'</span><input type="range" min="0" max="40" step="1" value="'+PESOS[t][v]+'"><b>'+PESOS[t][v]+'</b><small class="pe" data-v="'+v+'"></small>';
      var r=d.querySelector('input'), b=d.querySelector('b');
      r.oninput=function(){PESOS[t][v]=+r.value;b.textContent=r.value;pesosEfectivos();recalcDebounced()}; cont.appendChild(d); });
  });
  pesosEfectivos();
}
// Porcentaje efectivo de cada peso dentro de su bloque (lo que de verdad manda: la proporción, no el número).
function pesosEfectivos(){
  var t=tipoSel(), sd=0, sa=0, sm=0, bm=CFG.parametros.general.base_confianza_max||3.5;
  VARS.forEach(function(v){var w=+PESOS[t][v]||0; var bl=bloqueDe(v); if(bl==='base')sd+=w; else {sa+=w; if(bl==='mixta')sm+=w}});
  Array.prototype.forEach.call($('pesos').querySelectorAll('.pe'),function(el){var v=el.dataset.v, w=+PESOS[t][v]||0, bl=bloqueDe(v); el.textContent=bl==='base'?(sd?Math.round(w/sd*100)+' %':'—'):bl==='mixta'?('+'+(sm?Math.round(w/sm*100):0)+' % / −'+(sa?Math.round(w/sa*100):0)+' %'):('−'+(sa?Math.round(w/sa*100):0)+' %')});
  var a=+$('alpha').value;
  $('tot-desempeño').textContent=sd+' pts → hasta +'+bm.toFixed(1); var tm=$('tot-mixtas'); if(tm) tm.textContent=sm+' pts → hasta +'+(5-bm).toFixed(1); $('tot-antecedentes').textContent=(sa-sm)+' pts → hasta −'+(a*bm).toFixed(1)+' (junto con lo malo de las mixtas)';
  var maxD=null, maxA=null; VARS.forEach(function(v){var w=+PESOS[t][v]||0; if(esPenal(v)){if(!maxA||w>PESOS[t][maxA])maxA=v}else{if(!maxD||w>PESOS[t][maxD])maxD=v}});
  var mp=CFG.parametros.general.max_participacion_peso||{}; var lp=typeof mp==='object'?mp.comportamiento:mp;
  $('insight').innerHTML='<b>Cómo leer esto.</b> El score es una <b>cuenta de confianza</b>: <b>base ganada</b> (experiencia y antigüedad, de 0 a '+bm.toFixed(1)+'; un piloto recién activado arranca en 0.0) <b>+</b> lo que hace <b>mejor</b> que la referencia (hasta +'+(5-bm).toFixed(1)+', y se gana en proporción a la evidencia) <b>−</b> lo que hace <b>peor</b> y sus antecedentes (hasta −'+(a*bm).toFixed(1)+'). '+
    'Las <b>mixtas</b> son la misma variable para las dos cosas: cancelar menos que el promedio suma, cancelar más resta. Las <b>negativas</b> nunca suman. '+
    'Hoy la base la manda <i>'+(NOMBRES[maxD]||[maxD])[0]+'</i> ('+Math.round((PESOS[t][maxD]||0)/(sd||1)*100)+' %) y en el comportamiento pesa más <i>'+(NOMBRES[maxA]||[maxA])[0]+'</i> ('+Math.round((PESOS[t][maxA]||0)/(sa||1)*100)+' %: "en lo peor" quita como mucho '+(a*bm*(PESOS[t][maxA]||0)/(sa||1)).toFixed(2)+' puntos). Los sliders son relativos dentro de su bloque; ninguna del comportamiento pasa del '+Math.round((lp||0.35)*100)+' %.';
}
var tm=null; function recalcDebounced(){clearTimeout(tm);tm=setTimeout(recalc,NFILAS>5000?600:150)}
function paramsConAlpha(){ // inyecta alpha del slider en el YAML sin reformatearlo
  var y=$('params').value, a=$('alpha').value;
  if(/^\s*alpha_antecedentes:.*$/m.test(y)) return y.replace(/^(\s*alpha_antecedentes:).*$/m,'$1 '+a);
  return y.replace(/^general:\s*$/m,'general:\n  alpha_antecedentes: '+a);
}
async function recalc(){
  var body={pesos:PESOS,parametros_yaml:paramsConAlpha(),hoy:$('hoy').value,datos:$('fuente').value,solo_definitivos:$('soloDef').checked,n:10};
  $('msg').textContent='calculando…';
  var d=await (await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
  if(!d.ok){$('msg').innerHTML='<span class="err">'+d.error+'</span>';return} $('msg').textContent='';
  RANK=d.ranking; PARAMS=d.parametros; NFILAS=d.n_filas; var av=d.avisos[tipoSel()]||[]; $('avisos').textContent=av.length?'⚠ '+av.join(' · '):'';
  renderTabla(); if(SEL) renderDetalle(SEL);
}
function fmt(x){return x==null?'—':Number(x).toFixed(1)}
function fecha(d){return d?d.slice(0,10):'—'}
function calif(x){return x==null?'—':Number(x).toFixed(1)}
var CUPO_COL={NO_APLICA:'#d1d5db',SIN_CUPO:'#9ca3af',MINIMO:'#ea580c',MEDIO:'#ca8a04',ALTO:'#65a30d',MUY_ALTO:'#15803d',MAXIMO:'#2d1f7a'};
function cupoCell(c){if(!c)return '—'; return '<span class="pill" style="background:'+(CUPO_COL[c.tramo]||'#9ca3af')+'" title="'+(c.motivos||[]).join(' · ').replace(/"/g,'&quot;')+'">'+c.tramo.replace('_',' ')+'</span><br><small>'+c.texto+'</small>'}
function idCell(id,rotulo){if(!id)return '<small>'+rotulo+': —</small>';
  return '<span class="idc" data-id="'+id+'" title="Clic para copiar el ID de '+rotulo+'"><small>'+rotulo+'</small> '+id+' <b>⧉</b></span>'}
function copiarId(el){var id=el.dataset.id, ok=function(){var b=el.querySelector('b'); b.textContent='✓'; setTimeout(function(){b.textContent='⧉'},1200)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(id).then(ok,function(){copiarFallback(id);ok()})}else{copiarFallback(id);ok()}}
function copiarFallback(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta)}
function filaRank(r,pos){var obs=(r.observaciones||[]).slice(); if(r.caso) obs.push('<i>caso de prueba: '+r.caso+'</i>');
  return '<tr data-k="'+r.piloto_id+'|'+r.tipo+'" class="'+(SEL===r.piloto_id+'|'+r.tipo?'sel':'')+'"><td class="num">'+pos+'</td><td><b>'+r.nombre+'</b><br><small>'+r.piloto_id+' · '+r.tipo+'</small></td>'+
   '<td>'+idCell(r.driver_id||r.piloto_id,'piloto')+(r.passenger_id&&r.passenger_id!==r.driver_id?'<br>'+idCell(r.passenger_id,'pasajero'):'')+'</td><td>'+fecha(r.activado_piloto)+'<br>'+fecha(r.activado_pasajero)+'</td><td class="num"><b style="font-size:14px" title="rating_as_driver__fl de la app — NO es el promedio de lo que ponen los pasajeros (verificado 2026-09-16); lo que puntúa es calificacion_pasajero">'+calif(r.calif_app)+'</b></td>'+
   '<td class="num"><b style="font-size:14px">'+calif(r.calif_gamification)+'</b>'+(r.gamif_final!=null?'<br><small title="nivel · total_score_points">nivel '+Math.round(r.gamif_final)+' · '+Math.round(r.gamif_puntos||0).toLocaleString('es-CO')+' pts</small>':'')+'</td>'+
   '<td class="num"><b style="font-size:15px">'+fmt(r.score_final)+'</b>'+(r.score_final!==r.score_comportamental?'<br><small>score '+fmt(r.score_comportamental)+'</small>':'')+'</td><td><span class="pill b-'+r.banda+'">'+(r.banda||'SIN SCORE')+'</span><br><small>'+r.vigencia.toLowerCase()+' · n='+r.n_aplicables+'</small></td>'+
   '<td>'+cupoCell(r.cupo)+'</td><td class="est-'+r.estado+'">'+r.estado+'</td><td style="white-space:normal;min-width:260px;font-size:11px">'+(obs.length?obs.join('<br>'):'<small>Sin observaciones</small>')+'</td></tr>'}
function bloqueRank(titulo,rows,offset,color){ if(!rows.length) return '';
  return '<h3 style="margin:14px 0 4px;font-size:13px;color:'+color+'">'+titulo+' <small>('+rows.length+')</small></h3><table><thead><tr><th>#</th><th>Piloto</th><th>ID</th><th>Activación piloto<br>Activación pasajero</th><th class="num" title="passengers.rating_as_driver__fl: la calificación que la app le muestra al piloto. Sólo contexto, no entra al score nuevo">Score app</th><th class="num" title="vw_atr_driver_scoring_with_frauds: new_final_score_pibox / new_final_score_rent (abajo el nivel y los puntos). Sólo contexto">Score gamification<br>anterior</th><th class="num" title="Score Operacional de Pilotos: el de esta metodología (0 – 5)">Score nuevo<br>(nuestro)</th><th>Banda</th><th title="Cupo de confianza: cuánto valor declarado / recaudo se le puede confiar">Cupo COP</th><th>Estado</th><th>Observaciones</th></tr></thead><tbody>'+rows.map(function(r,i){return filaRank(r,offset+i+1)}).join('')+'</tbody></table>'}
function renderTabla(){
  if(!RANK) return; var t=$('tipo').value, tipos=t?[t]:['B2B','RENT','B2C'], h='', info=[];
  tipos.forEach(function(tp){var k=RANK[tp]; if(!k) return;
    info.push(tp+': '+k.n_ranking+' en ranking de '+k.n_total+(k.n_provisional?' ('+k.n_provisional+' provisionales'+($('soloDef').checked?' excluidos':'')+(k.n_sin_score?', '+k.n_sin_score+' sin score':'')+')':''));
    var orden=((PARAMS||CFG.parametros).bandas||[]).slice().sort(function(a,b){return b.desde-a.desde}).map(function(b){return b.nombre});
    var bandas=orden.filter(function(b){return k.bandas[b]}).map(function(b){var n=k.bandas[b], p=k.n_ranking?Math.round(n/k.n_ranking*100):0; return '<span class="pill b-'+b+'" style="margin-right:4px" title="'+p+' % de los '+k.n_ranking+' rankeados">'+b.replace('_',' ')+' '+n+' <span style="opacity:.8;font-weight:500">('+p+' %)</span></span>'}).join('<span style="color:var(--muted)">›</span> ');
    if(tipos.length>1) h+='<h2 style="margin-top:18px">'+tp+'</h2>';
    h+='<div style="margin:4px 0 6px">'+bandas+'</div>';
    h+=bloqueRank('Top 10 mejores',k.top,0,'#15803d')+bloqueRank('10 del medio',k.medio,k.medio_desde,'#ca8a04')+bloqueRank('10 peores',k.peores,k.peores_desde,'#dc2626');
    if(!k.n_ranking) h+='<div class="nota">Sin pilotos para rankear en '+tp+' con los filtros actuales.</div>';
  });
  $('rankInfo').textContent='· '+NFILAS.toLocaleString('es-CO')+' filas · '+info.join(' · ')+' · clic en una fila para ver el desglose';
  $('ranking').innerHTML=h;
  Array.prototype.forEach.call($('ranking').querySelectorAll('tr[data-k]'),function(tr){tr.onclick=function(ev){if(ev.target.closest&&ev.target.closest('.idc'))return;SEL=tr.dataset.k;marcarSel();renderDetalle(SEL)}});
  Array.prototype.forEach.call($('ranking').querySelectorAll('.idc'),function(el){el.onclick=function(ev){ev.stopPropagation();copiarId(el)}});
  marcarSel();
}
function marcarSel(){Array.prototype.forEach.call($('ranking').querySelectorAll('tr[data-k]'),function(tr){tr.className=tr.dataset.k===SEL?'sel':''})}
var NOMBRES={suspension_piloto:['Suspensiones como piloto','antecedente'],suspension_pasajero:['Suspensiones como pasajero','antecedente'],invitacion_pibox:['Invitaciones Pibox','antecedente'],invitacion_rent:['Invitaciones Rent','antecedente'],expulsion:['Expulsiones','antecedente'],baneo_imei:['Baneo de IMEI','antecedente'],conducta_inapropiada:['Conducta inapropiada confirmada','antecedente'],cancelacion_piloto:['Cancelaciones propias','negativa'],finalizados:['Experiencia (servicios finalizados)','base'],antiguedad:['Antigüedad como piloto','base'],activacion_express:['Activación express','negativa'],sin_novedades:['Servicios sin novedad y a tiempo','desempeño'],alto_valor:['Responsabilidad en alto valor','desempeño'],cumplimiento_reservas:['Cumplimiento de reservas','desempeño'],recaudo_24h:['Recaudo pagado en 24 h hábiles','desempeño'],recaudo_entregado:['Recaudos entregados bien','desempeño'],calificacion_pasajero:['Calificación de los pasajeros','desempeño']};
var PARAMS=null;
function pct(x,d){return (x*100).toFixed(d==null?0:d).replace('.',',')+' %'}
function dias(n){if(n>=365){var a=n/365;return a%1<0.1?Math.round(a)+(Math.round(a)===1?' año':' años'):a.toFixed(1).replace('.',',')+' años'}return n>=60?Math.round(n/30)+' meses':n+' días'}
function plural(n,s,p){return n+' '+(n===1?s:p)}
// Qué pasó (en palabras) + cómo se convierte en puntos, por variable
function explicar(v,s,r){
  var d=s.detalle, t=r.tipo, P=PARAMS||CFG.parametros;
  if(EVENTOS.indexOf(v)>=0){
    var c=P.eventos[v], nombre=NOMBRES[v][0].toLowerCase();
    var vent=d.desde?'desde el '+d.desde:'en los últimos '+dias(P.general.ventana_eventos_dias);
    if(!d.n_eventos) return {que:'Sin '+nombre+' registradas '+vent+'.',como:'Sin eventos = 5 de 5. No descuenta nada.'};
    var fuera=d.n_eventos-d.en_ventana, lista=(d.edades_dias||[]).slice().sort(function(a,b){return a-b}).map(function(e){return 'hace '+dias(e)}).join(', ');
    var que=(d.en_ventana?plural(d.en_ventana,'evento','eventos')+' ('+lista+')':'Ninguno '+vent)+(fuera?'; '+plural(fuera,'evento','eventos')+' fuera del período ('+(d.desde?'antes del '+d.desde:'más de '+dias(P.general.ventana_eventos_dias))+') ya no cuenta':'')+'.';
    if(!d.en_ventana) return {que:que,como:'Sin eventos en el período = 5 de 5. No descuenta nada.'};
    var como=(d.sin_decaimiento?'Cada evento pesa 1 sin importar la fecha (todos los casos '+vent+' cuentan igual)':'Cada evento pesa 1 el día que ocurre y la mitad cada '+dias(c.semivida_dias))+'; hoy suman <b>'+d.carga+'</b> de un tope de '+d.tope+' (con '+d.tope+' o más la variable llega a 0).';
    return {que:que,como:como};
  }
  function pt(c,k){var x=c[k]; return typeof x==='object'?x[t]:x}
  if(v==='antiguedad'){return {que:'Activado como piloto hace <b>'+d.dias+' días</b>'+(d.desde!=='registro'?' ('+d.desde+')':' (fecha de registro)')+'.',como:'Sube en línea recta hasta los '+d.dias_ref+' días y ahí llega a 5. Un recién activado vale 0: la confianza se gana con el tiempo.'};}
  if(v==='activacion_express'){var c=P.eventos[v]; if(!d.express) return {que:'Activación normal (con validación completa).',como:'Sin descuento.'};
    return {que:'Entró por <b>activación express</b> hace '+d.dias_desde_activacion+' días.',como:'Descuenta completo el día de la activación y se apaga a la mitad cada '+dias(c.semivida_dias)+' (hoy pesa '+d.carga+' de '+d.tope+').'};}
  if(v==='cancelacion_piloto'){var c=P.tasas[v];
    return {que:'Canceló <b>'+d.x+' de '+d.n+'</b> servicios que dependían de él en los últimos '+dias(d.ventana_dias||90)+' ('+pct(d.tasa_cruda,1)+'). '+(d.excluidos_no_atribuibles?'No se le cuentan '+d.excluidos_no_atribuibles+' cancelados por el pasajero o la plataforma.':'')+' Lo anterior a ese período no castiga.',
            como:'Ajustado por volumen queda en '+pct(d.tasa_ajustada,1)+'. La referencia de su tipo es '+pct(d.referencia_p0)+': hasta ahí no resta (y cancelar menos NO suma); por encima resta, hasta el máximo en '+pct(pt(c,'x_score0'))+'.'};}
  if(v==='finalizados'){
    return {que:'<b>'+d.n+'</b> servicios finalizados en la ventana'+(d.tasa_finalizacion!=null?' (terminó el '+pct(d.tasa_finalizacion)+' de los que dependían de él)':'')+'.',
            como:'La experiencia suma rápido al principio y se llena a los '+d.n_ref+' servicios; de ahí en adelante no da más puntos.'};}
  if(v==='sin_novedades'){var c=P.tasas[v];
    return {que:'<b>'+d.x+' de '+d.n+'</b> servicios finalizados en el último '+dias(d.ventana_dias||90).replace('1 año','año')+' salieron sin novedad y a tiempo ('+pct(d.tasa_cruda,1)+').',
            como:'Ajustado por volumen: '+pct(d.tasa_ajustada,1)+'. Referencia '+pct(d.referencia_p0)+': por encima suma, por debajo resta ('+pct(c.x_score5)+' = lo mejor, '+pct(c.x_score0)+' = lo peor).'};}
  if(v==='alto_valor'){var c=P.tasas[v], ex=d.exposicion, nivel=ex>=0.8?'alta':ex>=0.4?'media':'baja';
    return {que:'<b>'+d.n_alto_valor+'</b> servicios de alto valor ('+pct(d.proporcion)+' de sus servicios), <b>'+d.ok+'</b> sin novedad.',
            como:'Cumplimiento ajustado '+pct(d.cumplimiento_ajustado,1)+' frente a la referencia '+pct(c.p0)+': por encima suma, por debajo resta, siempre en proporción a la exposición '+nivel+' ('+ex.toFixed(2)+' de 1: se necesitan '+c.n_ref+' servicios de alto valor y que sean el '+pct(c.prop_ref)+' del total). Hacer servicios caros no suma por sí solo.'};}
  if(v==='recaudo_24h'){var c=P.tasas[v];
    var extra=[]; if(d.vencidos_sin_pagar) extra.push('<b>'+d.vencidos_sin_pagar+' vencido'+(d.vencidos_sin_pagar>1?'s':'')+' sin pagar</b>'); if(d.pendientes_en_plazo) extra.push(d.pendientes_en_plazo+' pendiente'+(d.pendientes_en_plazo>1?'s':'')+' todavía en plazo (no cuenta)');
    return {que:'Tuvo <b>'+d.episodios+'</b> recaudo'+(d.episodios>1?'s':'')+' sin abonar en el momento; pagó <b>'+d.a_tiempo+' de '+d.n+'</b> dentro de '+d.limite_horas+' h hábiles'+(d.tarde?', '+d.tarde+' tarde':'')+(extra.length?'; '+extra.join(', '):'')+'.',
            como:'Las horas corren de lunes a viernes (sábado y domingo no cuentan). Ajustado por volumen: '+pct(d.tasa_ajustada,1)+'. Referencia '+pct(d.referencia_p0)+': por encima suma, por debajo resta.'};}
  if(v==='recaudo_entregado'){var c=P.tasas[v];
    var extra=[]; if(d.no_pago) extra.push('<b>'+d.no_pago+' sin entregar</b> ($'+Math.round(d.monto_no_pagado).toLocaleString('es-CO')+')'); if(d.novedad) extra.push(d.novedad+' con novedad (entregado'+(d.novedad>1?'s':'')+' después de '+d.plazo_horas_habiles+' h hábiles)'); if(d.en_plazo) extra.push(d.en_plazo+' todavía en plazo (no cuenta)');
    return {que:'Tuvo que entregar <b>'+d.recaudos+'</b> recaudo'+(d.recaudos>1?'s':'')+' contra entrega ($'+Math.round(d.monto_total).toLocaleString('es-CO')+') en los últimos '+dias(d.ventana_dias||90)+'; entregó bien <b>'+d.bien+'</b>'+(extra.length?'; '+extra.join(', '):'')+'.',
            como:'"Bien" = su billetera Picash volvió a cero dentro de '+d.plazo_horas_habiles+' h hábiles. Un no pago cuenta como '+d.peso_no_pago+' novedades. Ajustado por volumen: '+pct(d.tasa_ajustada,1)+'. Referencia '+pct(d.referencia_p0)+': por encima suma, por debajo resta ('+pct(c.x_score5)+' = lo mejor, '+pct(c.x_score0)+' = lo peor).'};}
  if(v==='calificacion_pasajero'){var c=P.tasas[v];
    return {que:'Los pasajeros lo calificaron en <b>'+d.n+'</b> servicios finalizados en los últimos '+dias(d.ventana_dias||180)+': promedio <b>'+d.promedio_crudo.toFixed(2)+'</b> de 5 (sólo notas 1–5; no cuentan los que no calificaron ni los que saltaron la calificación).',
            como:'Ajustado por volumen queda en '+d.promedio_ajustado.toFixed(2)+' (con pocas notas se acerca a la referencia). Referencia '+Number(d.referencia_p0).toFixed(2)+': por encima suma, por debajo resta ('+Number(c.x_score5).toFixed(2)+' = lo mejor, '+Number(c.x_score0).toFixed(2)+' = lo peor).'};}
  if(v==='cumplimiento_reservas'){var c=P.tasas[v];
    return {que:'Cumplió <b>'+d.cumplidas+' de '+d.n+'</b> reservas que dependían de él en los últimos '+dias(d.ventana_dias||90)+' ('+pct(d.tasa_cruda,1)+'). '+(d.no_atribuibles_excluidas?d.no_atribuibles_excluidas+' con causa ajena no se cuentan.':''),
            como:'Ajustado por volumen: '+pct(d.tasa_ajustada,1)+'. Referencia '+pct(d.referencia_p0)+': por encima suma, por debajo resta.'};}
  return {que:'',como:''};
}
function colorSub(x){return x>=4?'#16a34a':x>=3?'#65a30d':x>=2?'#ca8a04':x>=1?'#ea580c':'#dc2626'}
function filaHTML(v,s,c,r){
  var e=explicar(v,s,r), sub=s.score, esAnt=esPenal(v), ef;
  if(!c) ef='<div class="ef cero">Peso 0: no influye</div>';
  else if(c.bloque==='base') ef='<div class="ef pos"><b>+'+c.aporte.toFixed(2)+'</b> a la base<br><small>pesa '+pct(c.peso_efectivo)+' de la base (máx. +'+(c.peso_efectivo*(r.contribuciones._bloques.base_max||3.5)).toFixed(2)+')</small></div>';
  else if(c.aporte>0.0005) ef='<div class="ef pos"><b>+'+c.aporte.toFixed(2)+'</b> puntos<br><small>mejor que la referencia (balance +'+(c.balance*100).toFixed(0)+' %); podría sumar hasta +'+c.max_ganancia.toFixed(2)+'</small></div>';
  else if(c.aporte<-0.0005) ef='<div class="ef neg"><b>'+c.aporte.toFixed(2)+'</b> puntos<br><small>'+(c.bloque==='mixta'?'peor que la referencia (balance '+(c.balance*100).toFixed(0)+' %)':'antecedente')+'; podría restar hasta −'+c.max_perdida.toFixed(2)+'</small></div>';
  else ef='<div class="ef cero">'+(c.bloque==='mixta'?'Igual que la referencia: 0':'No resta')+'<br><small>podría '+(c.bloque==='mixta'?'sumar hasta +'+c.max_ganancia.toFixed(2)+' o ':'')+'restar hasta −'+c.max_perdida.toFixed(2)+'</small></div>';
  return '<div class="fila"><div class="nom">'+NOMBRES[v][0]+'<small>'+v+'</small></div><div class="que">'+e.que+'<br><small>'+e.como+'</small></div>'+
    '<div><div class="barra"><i style="width:'+(sub/5*100)+'%;background:'+colorSub(sub)+'"></i></div><div class="pts"><b>'+sub.toFixed(2)+'</b> de 5 puntos</div></div>'+ef+'</div>';
}
async function renderDetalle(k){
  var partes=k.split('|'), body={pesos:PESOS,parametros_yaml:paramsConAlpha(),hoy:$('hoy').value,datos:$('fuente').value,piloto_id:partes[0],tipo:partes[1]};
  var d=await (await fetch('/api/detalle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
  if(!d.ok){$('detalle').innerHTML='<h2>Desglose</h2><div class="alerta">'+d.error+'</div>';return}
  var r=d.detalle; PARAMS=d.parametros; var b=r.contribuciones._bloques;
  var h='<h2>Desglose · '+r.piloto_id+' '+r.nombre+' · '+r.tipo+'</h2>';
  if(!b){$('detalle').innerHTML=h+'<div class="alerta">Sin score: no tiene servicios en la ventana sobre los que evaluar el desempeño.</div>';return}
  var sc=Math.max(0,Math.min(5,b.nota?0:b.score_sin_clip));
  h+='<div class="resumen"><div class="paso"><div class="k">1 · Base ganada</div><div class="v">'+b.A_base.toFixed(2)+' <small>/ '+b.base_max.toFixed(1)+'</small></div><div class="t">'+(b.nota?'piloto nuevo sin servicios: arranca en 0':'experiencia y antigüedad como piloto')+'</div></div><div class="flecha">+</div>'+
     '<div class="paso"><div class="k">2 · Mejor que la referencia</div><div class="v">+'+(b.ganancia||0).toFixed(2)+'</div><div class="t">'+(b.confianza<1?'ganado al '+Math.round(b.confianza*100)+' % (poca evidencia)':'lo que hace mejor que el promedio')+'</div></div><div class="flecha">−</div>'+
     '<div class="paso"><div class="k">3 · Peor + antecedentes</div><div class="v">−'+(b.perdida||0).toFixed(2)+'</div><div class="t">'+(b.perdida>0?'lo que hace peor y su historial':'nada que restar')+'</div></div><div class="flecha">=</div>'+
     '<div class="paso"><div class="k">4 · Score</div><div class="v">'+sc.toFixed(2)+'</div><div class="t">'+b.A_base.toFixed(2)+' + '+(b.ganancia||0).toFixed(2)+' − '+(b.perdida||0).toFixed(2)+(b.score_sin_clip>5||b.score_sin_clip<0?' (recortado a 0–5)':'')+'</div></div>'+
     (r.tope_por_regla!=null?'<div class="flecha">→</div><div class="paso"><div class="k">5 · Regla</div><div class="v">tope '+r.tope_por_regla.toFixed(1)+'</div><div class="t">'+r.alertas.join(', ')+'</div></div>':'')+
     '<div class="flecha">=</div><div class="paso final"><div class="k">Score final</div><div class="v">'+fmt(r.score_final)+' <small>'+(r.banda||'')+'</small></div><div class="t">'+(r.vigencia==='DEFINITIVO'?'definitivo: '+r.n_aplicables+' servicios (mín. '+r.n_min+')':'PROVISIONAL: sólo '+r.n_aplicables+' servicios de los '+r.n_min+' necesarios')+'</div></div></div>';
  if(r.cupo){var cp=r.cupo; h+='<div class="sec" style="margin-top:6px"><h3>Cupo de confianza en plata <small>(qué monto se le puede confiar en valor declarado o contra entrega)</small></h3>'+
    '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="pill" style="background:'+(CUPO_COL[cp.tramo]||'#9ca3af')+';font-size:13px;padding:4px 10px">'+cp.tramo.replace('_',' ')+'</span><b style="font-size:16px">'+cp.texto+(cp.moneda?' '+cp.moneda:'')+'</b></div>'+
    '<div class="nota">Cómo se llegó: '+(cp.motivos||[]).join(' → ')+'.</div></div>';}
  if(r.estado==='BLOQUEADO') h+='<div class="alerta">⛔ <b>Bloqueado por regla de riesgo</b> ('+r.alertas.join(', ')+'). El score se calcula igual pero no habilita nada.</div>';
  else if(r.estado==='RESTRINGIDO') h+='<div class="alerta">⚠ <b>Restringido</b>: '+r.restricciones_activas.concat((r.documentos||{}).restringe||[]).join(' · ')+'. El score se muestra, pero la restricción manda.</div>';
  if(r.alertas.length&&r.estado!=='BLOQUEADO'&&r.tope_por_regla==null) h+='<div class="alerta">ℹ Reglas activas sólo como alerta (la conducta ya la mide el score): '+r.alertas.join(', ')+'</div>';
  var dc=r.documentos||{}, dd=dc.detalle||{};
  if(dd.licencia!==undefined){
    var items=[['Licencia (RUNT)',dd.licencia+(dd.runt_consultado?' · consultado '+dd.runt_consultado:'')],['Policía',dd.policia],['SOAT',dd.soat_vence?'vence '+dd.soat_vence:'sin dato'],['Tecnomecánica',dd.tecno_vence?'vence '+dd.tecno_vence:'sin dato']];
    h+='<div class="sec"><h3>Documentos y habilitación</h3><p class="intro">No dan ni quitan puntos: una condición vencida restringe o alerta según parametros.yaml → documentos.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px">'+
       items.map(function(it){return '<div style="background:#f6f6f8;border-radius:8px;padding:8px 10px"><div style="font-size:11px;color:var(--muted)">'+it[0]+'</div><div>'+it[1]+'</div></div>'}).join('')+'</div>'+
       (dc.restringe&&dc.restringe.length?'<div class="alerta" style="margin-top:8px">⛔ '+dc.restringe.join('<br>')+'</div>':'')+
       (dc.alertas&&dc.alertas.length?'<div class="alerta" style="margin-top:8px;background:#fffbe6;border-color:#f0dc8a">⚠ '+dc.alertas.join('<br>')+'</div>':'')+
       (dc.por_vencer&&dc.por_vencer.length?'<div class="nota" style="margin-top:6px">⏳ '+dc.por_vencer.join(' · ')+'</div>':'')+'</div>';
  }
  var noap=[], sind=[];
  h+='<div class="sec"><h3>Base ganada (sólo suma)</h3><p class="intro">Experiencia y antigüedad: la confianza que se gana con el tiempo, hasta '+b.base_max.toFixed(1)+'. Un piloto recién activado arranca en 0 y va subiendo.</p>';
  Object.keys(r.sub_scores).forEach(function(v){var s=r.sub_scores[v];if(bloqueDe(v)!=='base')return;if(s.score==null){(s.motivo==='no_aplica'?noap:sind).push(NOMBRES[v][0]);return}h+=filaHTML(v,s,r.contribuciones[v],r)});
  h+='</div><div class="sec"><h3>Comportamiento (suma o resta según la referencia)</h3><p class="intro">La misma variable suma si el piloto está mejor que el promedio de su tipo y resta si está peor. Igual que el promedio = 0.</p>';
  Object.keys(r.sub_scores).forEach(function(v){var s=r.sub_scores[v];if(bloqueDe(v)!=='mixta')return;if(s.score==null){(s.motivo==='no_aplica'?noap:sind).push(NOMBRES[v][0]);return}h+=filaHTML(v,s,r.contribuciones[v],r)});
  h+='</div><div class="sec"><h3>Sólo restan: cancelaciones, antecedentes y activación</h3><p class="intro">Nada de esto suma: cancelar como el promedio o menos vale 0, y un historial limpio vale 0. Cada evento pierde peso con el tiempo.</p>';
  Object.keys(r.sub_scores).forEach(function(v){var s=r.sub_scores[v];if(bloqueDe(v)!=='negativa')return;if(s.score==null){(s.motivo==='no_aplica'?noap:sind).push(NOMBRES[v][0]);return}h+=filaHTML(v,s,r.contribuciones[v],r)});
  h+='</div>';
  if(noap.length) h+='<div class="nota">No aplican en '+r.tipo+' (fuera del cálculo, no cuentan como 0): '+noap.join(', ')+'.</div>';
  if(sind.length) h+='<div class="nota">Sin dato para evaluar (fuera del cálculo): '+sind.join(', ')+'.</div>';
  $('detalle').innerHTML=h;
}
