# ============================================================================
# PESOS POR TIPO DE SERVICIO — DEFINITIVOS (fijados por el usuario en el afinador,
# 2026-09-16). Independientes de la metodología: cambiar acá NO cambia cómo se mide
# nada. Se renormalizan sobre las variables que apliquen y tengan dato, así que la
# suma no tiene que ser 100: lo que manda es la proporción dentro de cada bloque.
# Bloques: BASE (finalizados, antiguedad) sólo suma hasta 3,5; MIXTAS (sin novedades,
# recaudo 24 h, recaudo entregado, alto valor, reservas, calificación de pasajeros)
# suman hasta +1,5 si están mejor que la referencia y restan si peor; NEGATIVAS
# (antecedentes, cancelación propia, activación express) sólo restan. Lo que resta
# (mixtas malas + negativas) llega hasta −3,5 con α = 1.
# Regla: ninguna variable > max_participacion_peso de su bloque (parametros.yaml).
# Lectura por tipo (proporción dentro del bloque):
#   B2B  base: experiencia 67 % · antigüedad 33 %   ·  mixtas: alto valor 40 %, recaudo
#        entregado 21 %, reservas 21 %, recaudo 24 h 10 %, sin novedades 8 %  ·  negativas:
#        activación express 19 %, expulsiones 12 %, invitaciones Pibox 10 %, cancelaciones 10 %
#   B2C  base 56/44 · mixtas: alto valor 42 %, recaudo entregado 23 %, sin novedades 23 %,
#        calificación 12 % · negativas: expulsiones 19 %, cancelaciones 12 %, conducta 11 %
#   RENT base 60/40 · única mixta: calificación de pasajeros · negativas: activación
#        express 22 %, expulsiones 16 %, invitaciones Rent 13 %, conducta 11 %
# ============================================================================
